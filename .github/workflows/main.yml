# Integrazione continua: verifica che il progetto compili e che i test passino
# a ogni push (su qualsiasi ramo) e a ogni pull request verso main.
# La pubblicazione su GitHub Pages è nel workflow separato deploy.yml.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test dei motori di gioco
        run: npm test
      - name: Build di produzione
        run: npm run build
      - name: Conserva la build (scaricabile per 7 giorni dal tab Actions)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
